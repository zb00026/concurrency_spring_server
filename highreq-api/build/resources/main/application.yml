server:
  port: 8080
  tomcat:
    # Default is 200. For 10k concurrent connections on one instance you need
    # more acceptor/worker threads; in production you scale out instead of up.
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 200

spring:
  application:
    name: highreq-api
  datasource:
    url: jdbc:h2:mem:highreq;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # Size pool to your DB's capacity, not to your request count.
      # cached reads should not touch the DB at all.
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cache:
    type: caffeine

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, caches
  metrics:
    enable:
      all: true

logging:
  level:
    root: info
